<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0d3a2e">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>麻雀 点数ドリル</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Noto+Serif+JP:wght@700;900&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap">
<style>
:root{
  color-scheme: dark;
  --felt:#0d3a2e; --felt-2:#124a3a; --felt-3:#18584560;
  --line:rgba(236,243,232,.12);
  --ink:#f2efe3; --muted:#9fbcaf;
  --gold:#e9bb4b; --gold-ink:#2a1f05;
  --ok:#66d396; --ng:#ff8a73;
  --tile:#f8f3e4; --tile-2:#ebe1c6; --tile-edge:#b9a46f; --back:#d98a2b;
  --man:#c3302a; --pin:#1c5aa3; --sou:#1b7442; --tile-ink:#1d1a14;
  --tw: min(32px, calc((min(100vw, 480px) - 58px) / 14.4));
  --display:"Dela Gothic One","Zen Kaku Gothic New",system-ui,sans-serif;
  --body:"Zen Kaku Gothic New","Hiragino Sans","Noto Sans JP",system-ui,sans-serif;
  --serif:"Noto Serif JP","Hiragino Mincho ProN","Yu Mincho",serif;
}
html,body{height:100%}
body{
  background:var(--felt);
  background-image:radial-gradient(120% 70% at 50% 0%, #15503f 0%, var(--felt) 60%);
  background-attachment:fixed;
  color:var(--ink); font-family:var(--body); font-size:15px; line-height:1.55;
  -webkit-tap-highlight-color:transparent;
}
.app{max-width:480px;margin:0 auto;padding-inline:16px;padding-block:10px 120px;display:flex;flex-direction:column;gap:12px}
header{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
h1{font-family:var(--display);font-weight:400;font-size:22px;margin:0;letter-spacing:.02em}
h1 small{font-family:var(--body);font-size:11px;color:var(--muted);letter-spacing:.12em;margin-left:6px}
.stats{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.stats b{color:var(--ink);font-weight:700}
.tabs{display:grid;grid-template-columns:repeat(4,1fr);background:rgba(0,0,0,.22);border-radius:12px;padding:4px;gap:4px;position:sticky;top:env(safe-area-inset-top,0px);z-index:5;backdrop-filter:blur(6px)}
.tabs button{appearance:none;border:0;background:transparent;color:var(--muted);font:700 14px/1 var(--body);padding:11px 0;border-radius:9px;cursor:pointer}
.tabs button[aria-selected="true"]{background:var(--ink);color:var(--felt)}
.tabs button:focus-visible,.choice:focus-visible,.next:focus-visible,.seg button:focus-visible,.linkbtn:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.card{background:var(--felt-2);border:1px solid var(--line);border-radius:14px;padding:14px 10px 16px;display:flex;flex-direction:column;gap:12px}
.chips{display:flex;flex-wrap:wrap;gap:6px;padding-inline:4px}
.chip{font-size:12.5px;font-weight:700;padding:4px 10px;border-radius:999px;background:rgba(0,0,0,.25);color:var(--ink);border:1px solid var(--line)}
.chip.oya{background:var(--gold);color:var(--gold-ink);border-color:transparent}
.chip.agari{background:var(--ink);color:var(--felt);border-color:transparent}
.chip.riichi{border-color:var(--gold);color:var(--gold)}
.ask{padding-inline:4px;font-weight:700;font-size:15px;color:var(--muted)}
.ask b{color:var(--ink)}
.bigq{display:flex;align-items:baseline;justify-content:center;gap:14px;padding:14px 0 6px;font-family:var(--display);font-size:44px;line-height:1}
.bigq span small{font-size:20px;margin-left:2px;color:var(--muted)}
.bigsub{text-align:center;color:var(--muted);font-size:12px;margin-top:-6px}

/* tiles */
.hand{display:flex;align-items:flex-end;justify-content:center;gap:7px;padding-top:14px}
.row{display:flex;gap:1px}
.winwrap{position:relative;display:flex}
.winwrap::before{content:attr(data-l);position:absolute;top:-17px;left:50%;transform:translateX(-50%);font-size:10px;font-weight:700;color:var(--gold);white-space:nowrap}
.winwrap .tile{outline:2px solid var(--gold);outline-offset:1px}
.melds{display:flex;flex-wrap:wrap;justify-content:center;gap:10px 12px}
.meld{display:flex;flex-direction:column;align-items:center;gap:3px}
.meld em{font-style:normal;font-size:10px;font-weight:700;color:var(--muted);letter-spacing:.1em}
.row{align-items:flex-end}
.tile{
  display:block;flex:none;width:var(--tw);height:calc(var(--tw)*1.348);
  border-radius:calc(var(--tw)*.14);
  filter:drop-shadow(0 2px 2px rgba(0,0,0,.35));
  user-select:none;-webkit-user-drag:none;
}
.yoko{position:relative;flex:none;width:calc(var(--tw)*1.348);height:var(--tw)}
.yoko .tile{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%) rotate(-90deg)}

/* answers */
.choices{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.choice{
  appearance:none;border:1px solid var(--line);border-radius:14px;
  background:rgba(0,0,0,.24);color:var(--ink);
  font:400 21px/1.1 var(--display);font-variant-numeric:tabular-nums;
  min-height:68px;padding:10px 6px;cursor:pointer;
  transition:transform .08s, background .15s;
}
.choice:active{transform:scale(.97)}
.choice small{display:block;font:500 11px/1.2 var(--body);color:var(--muted);margin-top:4px}
.choice.ok{background:var(--ok);color:#0a2a19;border-color:transparent}
.choice.ok small{color:#0a2a19}
.choice.ng{background:var(--ng);color:#3a0d05;border-color:transparent}
.choice.ng small{color:#3a0d05}
.choices.done .choice:not(.ok):not(.ng){opacity:.45}

.verdict{font-family:var(--display);font-size:24px;text-align:center}
.verdict.ok{color:var(--ok)} .verdict.ng{color:var(--ng)}
.exp{background:rgba(0,0,0,.2);border-radius:14px;padding:14px 16px;display:flex;flex-direction:column;gap:12px;font-size:14px}
.exp h3{margin:0 0 4px;font-size:11px;letter-spacing:.16em;color:var(--muted);font-weight:700}
.exp ul{list-style:none;margin:0;padding:0}
.exp li{display:flex;justify-content:space-between;gap:10px;padding:5px 0;border-bottom:1px dashed var(--line);font-variant-numeric:tabular-nums}
.exp li:last-child{border-bottom:0}
.exp li.sum{font-weight:700;border-top:1px solid var(--line);border-bottom:0;margin-top:2px}
.exp .res{font-size:15px;font-weight:700;text-align:center;padding-top:2px}
.exp .res b{font-family:var(--display);font-weight:400;font-size:22px;color:var(--gold);margin-left:4px}
.exp .calc{font-variant-numeric:tabular-nums;line-height:1.8}

.nextbar{position:fixed;left:0;right:0;bottom:0;padding:10px 16px calc(12px + env(safe-area-inset-bottom,0px));background:linear-gradient(to top,var(--felt) 65%,transparent);display:flex;justify-content:center;z-index:6}
.next{appearance:none;border:0;width:100%;max-width:448px;border-radius:14px;background:var(--gold);color:var(--gold-ink);font:400 19px/1 var(--display);padding:17px 0;cursor:pointer;box-shadow:0 4px 0 #a07a1c}
.next:active{transform:translateY(2px);box-shadow:0 2px 0 #a07a1c}

/* table */
.seg{display:inline-flex;background:rgba(0,0,0,.25);border-radius:10px;padding:3px;gap:3px}
.seg button{appearance:none;border:0;background:transparent;color:var(--muted);font:700 13px/1 var(--body);padding:9px 18px;border-radius:8px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--gold);color:var(--gold-ink)}
.tblwrap{overflow-x:auto;border-radius:12px;border:1px solid var(--line)}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums;font-size:13px}
th,td{padding:7px 6px;text-align:center;border-bottom:1px solid var(--line);white-space:nowrap}
thead th{background:rgba(0,0,0,.25);font-size:12px;color:var(--muted)}
tbody th{color:var(--gold);font-weight:700;background:rgba(0,0,0,.12)}
td .r{display:block;font-weight:700}
td .t{display:block;font-size:11px;color:var(--muted)}
td.lim .r{color:var(--gold)}
td.na{color:rgba(242,239,227,.25)}
.note{font-size:12px;color:var(--muted);line-height:1.7}
.foot{display:flex;justify-content:space-between;align-items:center;font-size:11px;color:var(--muted)}
.linkbtn{appearance:none;border:0;background:none;color:var(--muted);font:500 11px var(--body);text-decoration:underline;cursor:pointer;padding:6px 0}
@media (prefers-reduced-motion: reduce){ .choice,.next{transition:none} }
</style>
</head>
<body>

<div class="app">
  <header>
    <h1>点数ドリル<small>MAHJONG</small></h1>
    <div class="stats" id="stats"></div>
  </header>
  <nav class="tabs" role="tablist">
    <button role="tab" data-mode="quick" id="tab-quick">翻符→点</button>
    <button role="tab" data-mode="fu" id="tab-fu">符計算</button>
    <button role="tab" data-mode="full" id="tab-full">手牌→点</button>
    <button role="tab" data-mode="table" id="tab-table">早見表</button>
  </nav>
  <main id="main"></main>
  <div class="foot" id="foot">
    <span>赤ドラ・本場・切り上げ満貫なし／連風牌の雀頭は4符</span>
    <button class="linkbtn" id="reset">成績リセット</button>
  </div>
</div>
<div class="nextbar" id="nextbar" hidden><button class="next" id="next">次の問題 →</button></div>

<script id="engine">
// ===== 牌: 0-8 萬 / 9-17 筒 / 18-26 索 / 27-30 東南西北 / 31-33 白發中 =====
const HONOR = ['東','南','西','北','白','發','中'];
const KNUM = ['一','二','三','四','五','六','七','八','九'];
const isHonor = t => t >= 27;
const isYao = t => t >= 27 || t % 9 === 0 || t % 9 === 8;
const isDragon = t => t >= 31;
const isWind = t => t >= 27 && t <= 30;
const suitOf = t => t >= 27 ? 3 : Math.floor(t / 9);
const tileName = t => t >= 27 ? HONOR[t - 27] : (t % 9 + 1) + ['萬','筒','索'][suitOf(t)];
const MAX_FU = 50; // 出題は50符以下のよく出る形に絞る
const rnd = n =>Math.floor(Math.random() * n);
const pick = a => a[rnd(a.length)];
function pickW(vals, ws){ let s = ws.reduce((a,b)=>a+b,0), r = Math.random()*s; for(let i=0;i<vals.length;i++){ r -= ws[i]; if(r < 0) return vals[i]; } return vals[vals.length-1]; }
const WAIT = {ryanmen:'両面', kanchan:'嵌張（カンチャン）', penchan:'辺張（ペンチャン）', tanki:'単騎', shanpon:'双碰（シャンポン）'};

// ----- 点数 -----
const up100 = x => Math.ceil(x / 100) * 100;
function basePoints(han, fu){
  if(han >= 13) return 8000; if(han >= 11) return 6000; if(han >= 8) return 4000;
  if(han >= 6) return 3000; if(han >= 5) return 2000;
  return Math.min(fu * Math.pow(2, han + 2), 2000);
}
function limitName(han, fu){
  if(han >= 13) return '数え役満'; if(han >= 11) return '三倍満'; if(han >= 8) return '倍満';
  if(han >= 6) return '跳満'; if(han >= 5 || fu * Math.pow(2, han + 2) >= 2000) return '満貫';
  return '';
}
function payment(han, fu, oya, tsumo){
  const b = basePoints(han, fu);
  if(!tsumo){ const v = up100(b * (oya ? 6 : 4)); return {label: String(v), total: v}; }
  if(oya){ const v = up100(b * 2); return {label: v + 'オール', total: v * 3}; }
  const k = up100(b), o = up100(b * 2);
  return {label: k + '-' + o, total: k * 2 + o};
}

// ----- 面子分解 -----
function decompose(c){
  const res = [];
  const rec = (i, sets, pair) => {
    while(i < 34 && c[i] === 0) i++;
    if(i === 34){ res.push({pair, sets: sets.slice()}); return; }
    if(c[i] >= 3){ c[i] -= 3; sets.push({type:'kou', t:i}); rec(i, sets, pair); sets.pop(); c[i] += 3; }
    if(i < 27 && i % 9 <= 6 && c[i+1] > 0 && c[i+2] > 0){
      c[i]--; c[i+1]--; c[i+2]--; sets.push({type:'shun', t:i}); rec(i, sets, pair); sets.pop(); c[i]++; c[i+1]++; c[i+2]++;
    }
  };
  for(let p = 0; p < 34; p++) if(c[p] >= 2){ c[p] -= 2; rec(0, [], p); c[p] += 2; }
  return res;
}

// ----- 通常形の役と符 -----
function evalStd(h, menzen, groups, pair, wait){
  const {tsumo, riichi, seat, round} = h;
  const shun = groups.filter(g => g.type === 'shun');
  const kous = groups.filter(g => g.type !== 'shun');
  const all = [];
  groups.forEach(g => { if(g.type === 'shun') all.push(g.t, g.t+1, g.t+2); else all.push(g.t, g.t, g.t); });
  all.push(pair, pair);
  const anko = kous.filter(g => g.anko).length;
  const dragK = kous.filter(g => isDragon(g.t)).length;
  const windK = kous.filter(g => isWind(g.t)).length;
  const kanN = kous.filter(g => g.type === 'kan').length;
  const green = new Set([19,20,21,23,25,32]);
  if(anko === 4 || dragK === 3 || windK === 4 || (windK === 3 && isWind(pair)) || kanN === 4 ||
     all.every(isHonor) || all.every(t => !isHonor(t) && isYao(t)) || all.every(t => green.has(t))) return {yakuman:true};

  const yaku = []; const add = (n, v) => yaku.push([n, v]);
  if(riichi) add('立直', 1);
  if(menzen && tsumo) add('門前清自摸和', 1);
  const pairYakuhai = isDragon(pair) || pair === seat || pair === round;
  const pinfu = menzen && shun.length === 4 && !pairYakuhai && wait === 'ryanmen';
  if(pinfu) add('平和', 1);
  if(all.every(t => !isYao(t))) add('断么九', 1);
  if(menzen){
    const cnt = {}; shun.forEach(g => cnt[g.t] = (cnt[g.t] || 0) + 1);
    let pk = 0; Object.values(cnt).forEach(v => pk += Math.floor(v / 2));
    if(pk >= 2) add('二盃口', 3); else if(pk === 1) add('一盃口', 1);
  }
  kous.forEach(g => {
    if(g.t === 31) add('役牌 白', 1); if(g.t === 32) add('役牌 發', 1); if(g.t === 33) add('役牌 中', 1);
    if(g.t === seat) add('自風 ' + HONOR[g.t-27], 1);
    if(g.t === round) add('場風 ' + HONOR[g.t-27], 1);
  });
  for(let n = 0; n < 7; n++) if([0,1,2].every(s => shun.some(g => g.t === s*9+n))){ add('三色同順', menzen ? 2 : 1); break; }
  for(let s = 0; s < 3; s++) if([0,3,6].every(n => shun.some(g => g.t === s*9+n))){ add('一気通貫', menzen ? 2 : 1); break; }
  const gYao = g => g.type === 'shun' ? (g.t % 9 === 0 || g.t % 9 === 6) : isYao(g.t);
  if(shun.length > 0 && groups.every(gYao) && isYao(pair)){
    if(all.some(isHonor)) add('混全帯么九', menzen ? 2 : 1); else add('純全帯么九', menzen ? 3 : 2);
  }
  if(kous.length === 4) add('対々和', 2);
  if(anko === 3) add('三暗刻', 2);
  for(let n = 0; n < 9; n++) if([0,1,2].every(s => kous.some(g => g.t === s*9+n))){ add('三色同刻', 2); break; }
  if(kanN === 3) add('三槓子', 2);
  if(dragK === 2 && isDragon(pair)) add('小三元', 2);
  if(all.every(isYao)) add('混老頭', 2);
  const suits = new Set(all.filter(t => !isHonor(t)).map(suitOf));
  if(suits.size === 1){ if(all.some(isHonor)) add('混一色', menzen ? 3 : 2); else add('清一色', menzen ? 6 : 5); }

  // 符
  const items = [['副底', 20]]; let fu = 20;
  if(menzen && !tsumo){ items.push(['門前ロン', 10]); fu += 10; }
  kous.forEach(g => {
    let v = 2; if(isYao(g.t)) v *= 2; if(g.anko) v *= 2; if(g.type === 'kan') v *= 4;
    const kind = g.type === 'kan' ? (g.anko ? '暗槓' : '明槓') : (g.anko ? '暗刻' : '明刻');
    items.push([kind + ' ' + tileName(g.t) + (isYao(g.t) ? '（么九）' : '（中張）'), v]); fu += v;
  });
  if(isDragon(pair)){ items.push(['雀頭 ' + tileName(pair) + '（役牌）', 2]); fu += 2; }
  if(pair === seat){ items.push(['雀頭 ' + tileName(pair) + '（自風）', 2]); fu += 2; }
  if(pair === round){ items.push(['雀頭 ' + tileName(pair) + '（場風）', 2]); fu += 2; }
  if(wait === 'kanchan' || wait === 'penchan' || wait === 'tanki'){ items.push(['待ち ' + WAIT[wait].replace(/（.*）/, ''), 2]); fu += 2; }
  if(tsumo && !pinfu){ items.push(['ツモ', 2]); fu += 2; }
  let fuR = Math.ceil(fu / 10) * 10, note = '';
  if(pinfu && tsumo) note = '平和ツモはツモ符なしで20符';
  if(!menzen && fuR === 20){ fuR = 30; note = '鳴き手で20符のときは30符にする'; }
  return {yaku, fu: fuR, fuRaw: fu, fuItems: items, fuNote: note, wait, pinfu};
}

function evalChiitoi(h, c){
  const all = []; c.forEach((v, t) => { for(let k = 0; k < v; k++) all.push(t); });
  if(all.every(isHonor)) return {yakuman:true};
  const yaku = []; const add = (n, v) => yaku.push([n, v]);
  if(h.riichi) add('立直', 1);
  if(h.tsumo) add('門前清自摸和', 1);
  add('七対子', 2);
  if(all.every(t => !isYao(t))) add('断么九', 1);
  if(all.every(isYao)) add('混老頭', 2);
  const suits = new Set(all.filter(t => !isHonor(t)).map(suitOf));
  if(suits.size === 1){ if(all.some(isHonor)) add('混一色', 3); else add('清一色', 6); }
  return {yaku, fu: 25, fuRaw: 25, fuItems: [['七対子（固定）', 25]], fuNote: '七対子は常に25符（切り上げなし）', wait: 'tanki', chiitoi: true};
}

// h = {fixed:[{type,t,open}], free:counts(和了牌込み), win, tsumo, riichi, seat, round, dora, oya}
function evaluate(h){
  const menzen = h.fixed.every(g => !g.open);
  const c = h.free.slice();
  if(h.fixed.length === 0){
    const ss = new Set(); let honors = false;
    c.forEach((v, t) => { if(v){ if(isHonor(t)) honors = true; else ss.add(suitOf(t)); } });
    if(!honors && ss.size === 1){
      const s = [...ss][0], need = [3,1,1,1,1,1,1,1,3];
      if(need.every((n, i) => c[s*9+i] >= n)) return {yakuman:true};
    }
  }
  let best = null, yakuman = false;
  const consider = r => {
    if(r.yakuman){ yakuman = true; return; }
    const yakuHan = r.yaku.reduce((a, y) => a + y[1], 0);
    const yaku = r.yaku.slice();
    if(yakuHan > 0 && h.dora > 0) yaku.push(['ドラ', h.dora]);
    const han = yakuHan > 0 ? yakuHan + h.dora : 0;
    const pay = han > 0 ? payment(han, r.fu, h.oya, h.tsumo) : {label:'', total:0};
    const res = {...r, yaku, yakuHan, han, pay, limit: han > 0 ? limitName(han, r.fu) : ''};
    if(!best || pay.total > best.pay.total || (pay.total === best.pay.total && (han > best.han || (han === best.han && r.fu > best.fu)))) best = res;
  };
  decompose(c.slice()).forEach(d => {
    const spots = [];
    if(d.pair === h.win) spots.push(-1);
    d.sets.forEach((s, i) => { if(s.type === 'kou' ? s.t === h.win : (h.win >= s.t && h.win <= s.t + 2)) spots.push(i); });
    spots.forEach(wi => {
      let wait;
      if(wi === -1) wait = 'tanki';
      else {
        const s = d.sets[wi];
        if(s.type === 'kou') wait = 'shanpon';
        else {
          const p = h.win - s.t, n = s.t % 9;
          wait = p === 1 ? 'kanchan' : p === 0 ? (n === 6 ? 'penchan' : 'ryanmen') : (n === 0 ? 'penchan' : 'ryanmen');
        }
      }
      const groups = h.fixed.map(g => ({type:g.type, t:g.t, anko: !g.open && g.type !== 'shun'}))
        .concat(d.sets.map((s, i) => ({type:s.type, t:s.t, anko: s.type === 'kou' && !(i === wi && !h.tsumo)})));
      consider(evalStd(h, menzen, groups, d.pair, wait));
    });
  });
  if(h.fixed.length === 0 && c.filter(v => v === 2).length === 7) consider(evalChiitoi(h, c));
  if(yakuman) return {yakuman:true};
  return best;
}

// ----- 手牌生成 -----
function tryGen(){
  const seat = 27 + rnd(4), round = Math.random() < 0.7 ? 27 : 28;
  const tsumo = Math.random() < 0.45;
  const dora = pickW([0,1,2,3], [50,30,15,5]);
  const theme = Math.random();
  const oneSuit = theme < 0.2 ? rnd(3) : -1;
  const simples = theme >= 0.2 && theme < 0.38;
  const randTile = shun => {
    const s = oneSuit >= 0 ? oneSuit : rnd(3);
    if(shun) return s*9 + (simples ? 1 + rnd(5) : rnd(7));
    if(!simples && Math.random() < (oneSuit >= 0 ? 0.35 : 0.25)) return 27 + rnd(7);
    return s*9 + (simples ? 1 + rnd(7) : rnd(9));
  };
  const counts = new Array(34).fill(0);
  let fixed = [], free = new Array(34).fill(0), win, riichi;

  if(Math.random() < 0.08){
    const ts = new Set(); while(ts.size < 7) ts.add(randTile(false));
    ts.forEach(t => free[t] = 2);
    win = pick([...ts]); riichi = Math.random() < 0.55;
  } else {
    const nOpen = Math.random() < 0.6 ? 0 : 1 + rnd(3);
    const sets = [];
    for(let i = 0; i < 4; i++){
      const sh = Math.random() < 0.66;
      sets.push({type: sh ? 'shun' : 'kou', t: randTile(sh), open: i < nOpen});
    }
    if(Math.random() < 0.06){ const k = sets.find(s => s.type === 'kou'); if(k) k.type = 'kan'; }
    const pair = randTile(false);
    if(pair === seat && pair === round) return null;
    sets.forEach(s => { if(s.type === 'shun'){ counts[s.t]++; counts[s.t+1]++; counts[s.t+2]++; } else counts[s.t] += s.type === 'kan' ? 4 : 3; });
    counts[pair] += 2;
    if(counts.some(v => v > 4)) return null;
    const cands = [pair, pair];
    sets.forEach(s => {
      if(s.open || s.type === 'kan'){ fixed.push({type:s.type, t:s.t, open:s.open, called: rnd(3), from: rnd(3)}); return; }
      if(s.type === 'shun'){ cands.push(s.t, s.t+1, s.t+2); free[s.t]++; free[s.t+1]++; free[s.t+2]++; }
      else { cands.push(s.t); free[s.t] += 3; }
    });
    free[pair] += 2;
    win = pick(cands);
    riichi = nOpen === 0 && Math.random() < 0.55;
  }
  const h = {fixed, free, win, tsumo, riichi, seat, round, dora, oya: seat === 27};
  const r = evaluate(h);
  if(!r || r.yakuman || r.yakuHan === 0 || r.fu > MAX_FU) return null;
  h.res = r;
  return h;
}
function genHand(){ for(let i = 0; i < 2000; i++){ const h = tryGen(); if(h) return h; } }
</script>

<script>
const $ = s => document.querySelector(s);
const main = $('#main');
const FU_LIST = [20,25,30,40,50,60,70,80,90,100,110];
const Q_FU = FU_LIST.filter(f => f <= MAX_FU);
const MODES = ['quick','fu','full'];
const KEY = 'mj-drill-v1';
let state = {mode:'quick', q:null, answered:false, tableOya:false};
let stats = loadStats();

function loadStats(){
  const blank = {}; MODES.forEach(m => blank[m] = {n:0, ok:0, streak:0, best:0});
  try{ const s = JSON.parse(localStorage.getItem(KEY)); if(s) return Object.assign(blank, s.stats || {}); }catch(e){}
  return blank;
}
function saveStats(){ try{ localStorage.setItem(KEY, JSON.stringify({stats, mode: state.mode})); }catch(e){} }
try{ const s = JSON.parse(localStorage.getItem(KEY)); if(s && s.mode) state.mode = s.mode; }catch(e){}

function shuffle(a){ for(let i = a.length - 1; i > 0; i--){ const j = rnd(i + 1); [a[i], a[j]] = [a[j], a[i]]; } return a; }

// ----- tiles -----
const HONOR_FILE = ['ton','nan','sya','pe','haku','hatu','tyun'];
function tileHTML(t){
  if(t === -1) return '<img class="tile" src="tiles/null.png" alt="裏">';
  const f = t >= 27 ? HONOR_FILE[t-27] : (t % 9 + 1) + 'mps'[suitOf(t)];
  return `<img class="tile" src="tiles/${f}.png" alt="${tileName(t)}">`;
}
const yokoHTML = t => `<span class="yoko">${tileHTML(t)}</span>`;
// 鳴いた牌を横向きに。pos: 上家=0 / 対面=1 / 下家=末尾
function calledRow(tiles, calledIdx, pos){
  const called = tiles[calledIdx], rest = tiles.filter((_, i) => i !== calledIdx);
  const out = rest.map(tileHTML);
  out.splice(pos, 0, yokoHTML(called));
  return out.join('');
}
function handHTML(h){
  const c = h.free.slice(); c[h.win]--;
  const closed = []; c.forEach((v, t) => { for(let k = 0; k < v; k++) closed.push(t); });
  let html = `<div class="hand"><div class="row">${closed.map(tileHTML).join('')}</div>
    <div class="winwrap" data-l="${h.tsumo ? 'ツモ' : 'ロン'}">${tileHTML(h.win)}</div></div>`;
  if(h.fixed.length){
    html += '<div class="melds">' + h.fixed.map(g => {
      let tag, row;
      if(g.type === 'shun'){ tag = 'チー'; row = calledRow([g.t, g.t+1, g.t+2], g.called, 0); }
      else if(g.type === 'kou'){ tag = 'ポン'; row = calledRow([g.t, g.t, g.t], 0, [0, 1, 2][g.from]); }
      else if(g.open){ tag = '明槓'; row = calledRow([g.t, g.t, g.t, g.t], 0, [0, 1, 3][g.from]); }
      else { tag = '暗槓'; row = [-1, g.t, g.t, -1].map(tileHTML).join(''); }
      return `<div class="meld"><em>${tag}</em><div class="row">${row}</div></div>`;
    }).join('') + '</div>';
  }
  return html;
}
function condChips(h){
  const w = HONOR[h.seat - 27];
  return `<div class="chips">
    <span class="chip ${h.oya ? 'oya' : ''}">${h.oya ? '親' : '子'}・${w}家</span>
    <span class="chip">${HONOR[h.round - 27]}場</span>
    <span class="chip agari">${h.tsumo ? 'ツモ' : 'ロン'}</span>
    ${h.riichi ? '<span class="chip riichi">リーチ</span>' : ''}
    ${h.dora ? `<span class="chip">ドラ${h.dora}</span>` : ''}
  </div>`;
}

// ----- 問題生成 -----
function nearLabels(correct, oya, tsumo, total){
  const pool = new Map();
  for(let han = 1; han <= 13; han++) for(const fu of Q_FU){
    const p = payment(han, fu, oya, tsumo);
    if(p.label !== correct && !pool.has(p.label)) pool.set(p.label, p.total);
  }
  // 親子の取り違えも混ぜる（同じ表記形式のロンのみ）
  const arr = [...pool.entries()].sort((a, b) => Math.abs(a[1] - total) - Math.abs(b[1] - total));
  return shuffle(arr.slice(0, 6)).slice(0, 3).map(e => e[0]);
}
function pointChoices(pay, oya, tsumo){
  return shuffle([pay.label, ...nearLabels(pay.label, oya, tsumo, pay.total)]);
}
function genQuick(){
  const oya = Math.random() < 0.35, tsumo = Math.random() < 0.5;
  let han, fu;
  if(Math.random() < 0.12){ han = pick([5,5,6,6,7,8,9,10,11,12,13]); fu = 30; }
  else {
    for(;;){
      han = pickW([1,2,3,4], [28,32,26,14]);
      fu = pickW(Q_FU, [10,6,38,32,14]);
      if(fu === 20 && (!tsumo || han < 2)) continue;
      if(fu === 25 && (tsumo ? han < 3 : han < 2)) continue;
      break;
    }
  }
  const pay = payment(han, fu, oya, tsumo);
  return {kind:'quick', han, fu, oya, tsumo, pay, choices: pointChoices(pay, oya, tsumo), correct: pay.label};
}
function genFu(){
  const h = genHand(), fu = h.res.fu;
  const opts = fu === 25 ? [20,25,30,40] : [20,30,40,50];
  return {kind:'fu', h, choices: opts.map(String), correct: String(fu)};
}
function genFull(){
  const h = genHand(), pay = h.res.pay;
  return {kind:'full', h, choices: pointChoices(pay, h.oya, h.tsumo), correct: pay.label};
}

// ----- 解説 -----
function calcHTML(han, fu, oya, tsumo){
  const lim = limitName(han, fu), b = basePoints(han, fu);
  let s = '';
  if(han >= 5) s += `${han}翻 → <b>${lim}</b>（基本点 ${b}）<br>`;
  else {
    const raw = fu * Math.pow(2, han + 2);
    s += `基本点 = ${fu} × 2<sup>${han}+2</sup> = ${raw}<br>`;
    if(raw >= 2000) s += `2000以上なので <b>満貫</b>（基本点 2000）<br>`;
  }
  if(!tsumo) s += `${oya ? '親' : '子'}ロン：${b} × ${oya ? 6 : 4} = ${b * (oya ? 6 : 4)} → <b>${up100(b * (oya ? 6 : 4))}</b>`;
  else if(oya) s += `親ツモ：各家 ${b} × 2 = ${b*2} → <b>${up100(b*2)}オール</b>`;
  else s += `子ツモ：子 ${b} → <b>${up100(b)}</b>、親 ${b} × 2 = ${b*2} → <b>${up100(b*2)}</b>`;
  return `<div class="calc">${s}<br><span class="note">※100点未満は切り上げ</span></div>`;
}
function handExplain(h, showPoints){
  const r = h.res;
  const yaku = r.yaku.map(y => `<li><span>${y[0]}</span><span>${y[1]}翻</span></li>`).join('');
  const fus = r.fuItems.map(f => `<li><span>${f[0]}</span><span>${f[1]}符</span></li>`).join('');
  const fuSum = r.chiitoi ? '' : `<li class="sum"><span>合計 ${r.fuRaw}符 → 切り上げ</span><span>${r.fu}符</span></li>`;
  const who = `${h.oya ? '親' : '子'}${h.tsumo ? 'ツモ' : 'ロン'}`;
  return `<div class="exp">
    <div><h3>役</h3><ul>${yaku}<li class="sum"><span>合計</span><span>${r.han}翻</span></li></ul></div>
    <div><h3>符　<span style="letter-spacing:0">待ち：${WAIT[r.wait]}</span></h3><ul>${fus}${fuSum}</ul>
      ${r.fuNote ? `<div class="note">※${r.fuNote}</div>` : ''}</div>
    ${showPoints ? `<div><h3>点数</h3>${calcHTML(r.han, r.fu, h.oya, h.tsumo)}</div>` : ''}
    <div class="res">${r.han}翻${r.fu}符${r.limit ? '・' + r.limit : ''} ${who}<b>${r.pay.label}</b></div>
  </div>`;
}

// ----- 描画 -----
function renderStats(){
  const el = $('#stats');
  if(state.mode === 'table'){ el.textContent = ''; return; }
  const s = stats[state.mode];
  const rate = s.n ? Math.round(s.ok / s.n * 100) : 0;
  el.innerHTML = `正解 <b>${s.ok}</b>/${s.n}（${rate}%）・連続 <b>${s.streak}</b>・最高 ${s.best}`;
}
function renderTabs(){
  document.querySelectorAll('.tabs button').forEach(b => b.setAttribute('aria-selected', b.dataset.mode === state.mode));
  $('#foot').hidden = false;
}
function render(){
  renderTabs(); renderStats();
  if(state.mode === 'table'){ $('#nextbar').hidden = true; renderTable(); return; }
  const q = state.q;
  let top = '';
  if(q.kind === 'quick'){
    top = `<section class="card">
      <div class="chips">
        <span class="chip ${q.oya ? 'oya' : ''}">${q.oya ? '親' : '子'}</span>
        <span class="chip agari">${q.tsumo ? 'ツモ' : 'ロン'}</span>
      </div>
      <div class="bigq"><span>${q.han}<small>翻</small></span>${q.han < 5 ? `<span>${q.fu}<small>符</small></span>` : ''}</div>
      ${q.han >= 5 ? '<div class="bigsub">5翻以上は符に関係なく決まる</div>' : ''}
      <div class="ask"><b>${q.oya ? '親' : '子'}の${q.tsumo ? 'ツモ' : 'ロン'}</b>和了。点数は？</div>
    </section>`;
  } else {
    top = `<section class="card">
      ${condChips(q.h)}
      ${handHTML(q.h)}
      <div class="ask">${q.kind === 'fu' ? '<b>何符？</b>（切り上げ後）' : '<b>点数は？</b>'}</div>
    </section>`;
  }
  const choices = `<div class="choices" id="choices">${q.choices.map((c, i) =>
    `<button class="choice" data-i="${i}" id="c${i}">${c}${q.kind === 'fu' ? '<small>符</small>' : ''}</button>`).join('')}</div>`;
  main.innerHTML = `<div style="display:flex;flex-direction:column;gap:12px">${top}${choices}<div id="after"></div></div>`;
  $('#nextbar').hidden = true;
  main.querySelectorAll('.choice').forEach(b => b.addEventListener('click', () => answer(+b.dataset.i)));
}
function answer(i){
  if(state.answered) return;
  state.answered = true;
  const q = state.q, ok = q.choices[i] === q.correct;
  const s = stats[state.mode];
  s.n++; if(ok){ s.ok++; s.streak++; s.best = Math.max(s.best, s.streak); } else { s.streak = 0; try{ navigator.vibrate && navigator.vibrate(40); }catch(e){} }
  saveStats(); renderStats();
  const box = $('#choices'); box.classList.add('done');
  box.querySelectorAll('.choice').forEach(b => {
    const c = q.choices[+b.dataset.i];
    if(c === q.correct) b.classList.add('ok'); else if(+b.dataset.i === i) b.classList.add('ng');
  });
  let exp;
  if(q.kind === 'quick') exp = `<div class="exp">${calcHTML(q.han, q.fu, q.oya, q.tsumo)}</div>`;
  else exp = handExplain(q.h, q.kind === 'full');
  $('#after').innerHTML = `<div style="display:flex;flex-direction:column;gap:10px">
    <div class="verdict ${ok ? 'ok' : 'ng'}">${ok ? '正解！' : '不正解… 正解は ' + q.correct + (q.kind === 'fu' ? '符' : '')}</div>${exp}</div>`;
  $('#nextbar').hidden = false;
  $('#next').focus({preventScroll:true});
}
function newQuestion(){
  state.answered = false;
  state.q = state.mode === 'quick' ? genQuick() : state.mode === 'fu' ? genFu() : genFull();
  render();
  window.scrollTo({top:0});
}
function renderTable(){
  const oya = state.tableOya;
  const rows = FU_LIST.map(fu => {
    const cells = [1,2,3,4].map(han => {
      const ronOK = !(fu === 20 || (fu === 25 && han < 2));
      const tsuOK = !((fu === 20 && han < 2) || (fu === 25 && han < 3));
      if(!ronOK && !tsuOK) return '<td class="na">—</td>';
      const lim = limitName(han, fu);
      if(lim) return `<td class="lim"><span class="r">満貫</span></td>`;
      const r = ronOK ? payment(han, fu, oya, false).label : '—';
      const t = tsuOK ? payment(han, fu, oya, true).label : '—';
      return `<td><span class="r">${r}</span><span class="t">${t}</span></td>`;
    }).join('');
    return `<tr><th>${fu}符</th>${cells}</tr>`;
  }).join('');
  const limits = [['満貫','5翻'],['跳満','6-7翻'],['倍満','8-10翻'],['三倍満','11-12翻'],['数え役満','13翻〜']].map(([n, h], i) => {
    const han = [5,6,8,11,13][i];
    return `<tr><th>${n}</th><td>${h}</td><td><span class="r">${payment(han, 30, oya, false).label}</span></td><td><span class="r">${payment(han, 30, oya, true).label}</span></td></tr>`;
  }).join('');
  main.innerHTML = `<div style="display:flex;flex-direction:column;gap:12px">
    <div style="display:flex;justify-content:space-between;align-items:center">
      <div class="seg"><button id="t-ko" aria-pressed="${!oya}">子</button><button id="t-oya" aria-pressed="${oya}">親</button></div>
      <span class="note">上：ロン　下：ツモ</span>
    </div>
    <div class="tblwrap"><table><thead><tr><th></th><th>1翻</th><th>2翻</th><th>3翻</th><th>4翻</th></tr></thead><tbody>${rows}</tbody></table></div>
    <div class="tblwrap"><table><thead><tr><th></th><th>翻数</th><th>ロン</th><th>ツモ</th></tr></thead><tbody>${limits}</tbody></table></div>
    <p class="note">基本点 = 符 × 2<sup>(翻+2)</sup>。子ロンは×4、親ロンは×6、ツモは子が×1・親が×2を各自払い（100点未満切り上げ）。基本点が2000を超えたら満貫。</p>
  </div>`;
  $('#t-ko').onclick = () => { state.tableOya = false; renderTable(); };
  $('#t-oya').onclick = () => { state.tableOya = true; renderTable(); };
}

document.querySelectorAll('.tabs button').forEach(b => b.addEventListener('click', () => {
  state.mode = b.dataset.mode; saveStats();
  if(state.mode === 'table') render(); else newQuestion();
}));
$('#next').addEventListener('click', newQuestion);
let resetArm = false;
$('#reset').addEventListener('click', e => {
  if(!resetArm){ resetArm = true; e.target.textContent = 'もう一度押すとリセット'; setTimeout(() => { resetArm = false; e.target.textContent = '成績リセット'; }, 3000); return; }
  MODES.forEach(m => stats[m] = {n:0, ok:0, streak:0, best:0}); saveStats(); renderStats();
  resetArm = false; e.target.textContent = '成績リセット';
});

if(state.mode === 'table') render(); else newQuestion();
</script>
</body>
</html>
